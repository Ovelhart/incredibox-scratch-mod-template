<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="phosphorus.css">
    <title>app</title>
    <style>
        html,
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            overflow: hidden;
            background-color: black;
        }

        iframe {
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            height: 99%;
            width: 90%;
            max-width: 130vh;
        }
        iframe * {
            user-select: none !important;
            -webkit-user-drag: none !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        * {
            user-select: none !important;
            -webkit-user-drag: none !important;
        }

        #exit-btn {
            fill: white;
            background-color: gray;
            width: 4rem;
            height: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            border-radius: 50%;
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        #exit-btn:hover {
            background-color: rgb(83, 83, 83);
        }

        #exit-btn svg {
            display: flex;
            flex-direction: column;
            height: 2rem;
            width: 2rem;
        }

        #fade {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 9999;
            opacity: 1;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #fade.fade-out {
            opacity: 0;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <div id="fade"></div>
    <div id="exit-btn">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
                d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z" />
        </svg>
    </div>
    <iframe id="game-frame" src="embed.html?project_url=mod/mod.sb3&auto-start=true&light-content=false" allowfullscreen="true"
        allowtransparency="true" style="border:none;">
    </iframe>
    <script src="phosphorus.dist.js"></script>
</body>

</html>
<script>
    const exitBtn = document.getElementById('exit-btn');
    const gameFrame = document.getElementById('game-frame');

    exitBtn.addEventListener('click', function () {
        window.location.href = 'index.html';
    });
    window.addEventListener("load", () => {
        const fade = document.getElementById("fade");
        fade.classList.add("fade-out");
        fade.addEventListener("transitionend", () => {
            fade.remove();
        });
    });

    // ---- Interface size: applies the value saved from the config menu
    // (index.html), respecting the same min/max limits calculated from
    // screen size. ----
    const UI_SIZE_DEFAULT = 100;

    function getSizeLimits() {
        const width = window.innerWidth;

        let min = 70;
        let max = 150;

        if (width <= 400) {
            min = 50;
            max = 110;
        } else if (width <= 700) {
            min = 60;
            max = 130;
        } else if (width <= 1100) {
            min = 70;
            max = 150;
        } else {
            min = 70;
            max = 180;
        }

        return { min, max };
    }

    function applyInterfaceSize(percentage) {
        document.documentElement.style.fontSize = percentage + "%";
    }

    function loadInterfaceSize() {
        const saved = localStorage.getItem("uiSize");
        const { min, max } = getSizeLimits();
        let percentage = saved ? parseInt(saved, 10) : UI_SIZE_DEFAULT;
        percentage = Math.min(Math.max(percentage, min), max);
        applyInterfaceSize(percentage);
    }

    loadInterfaceSize();

    // Re-adjust if the screen changes size (rotation, window resize).
    let resizeTimeout;
    window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(loadInterfaceSize, 200);
    });

    // If the user goes back to index.html, changes the size there, and
    // returns to app.html without a full page reload (e.g. future SPA
    // navigation), this would pick up the change. Since navigation today
    // is a normal link, the value always comes in correctly from
    // localStorage on the load above; but we also listen for "storage"
    // to cover opening the game in another tab while tweaking the size
    // in the menu tab.
    window.addEventListener("storage", (e) => {
        if (e.key === "uiSize") {
            loadInterfaceSize();
        }
    });

    // ---- Dark mode: reads the theme saved by the config menu and applies
    // it to the background, then sends it to embed.html as soon as it
    // reports that it has loaded. ----
    function isDarkMode() {
        return localStorage.getItem("tema") !== "light";
    }

    function sendThemeToEmbed() {
        if (gameFrame && gameFrame.contentWindow) {
            gameFrame.contentWindow.postMessage(
                { type: "theme-change", dark: isDarkMode() },
                "*"
            );
        }
    }

    // embed.html sends a "hello" message as soon as the player
    // initializes, and "load" when the project finishes loading. We send
    // the theme at both points to make sure the sprite already exists
    // by the time the message arrives (the costume can only be swapped
    // after the project has loaded).
    window.addEventListener('message', function (e) {
        const data = e.data;
        if (!data || !data.type) return;
        if (data.type === 'hello' || data.type === 'load') {
            sendThemeToEmbed();
        }
    });

    function applyThemeColors(colors) {
        if (!colors) return;
        document.documentElement.style.backgroundColor = colors.appBackgroundColor;
        document.body.style.backgroundColor = colors.appBackgroundColor;
        const fade = document.getElementById("fade");
        if (fade) fade.style.background = colors.appBackgroundColor;
    }

    // Load app.json and apply the app's background color for the
    // current theme (dark/light).
    fetch('mod/app.json').then(function (r) {
        return r.ok ? r.json() : null;
    }).then(function (data) {
        if (!data) return;
        const key = isDarkMode() ? "dark" : "light";
        const colors = data[key] || data;
        applyThemeColors(colors);
    }).catch(function () {
        // app.json missing or invalid: keep the default background.
    });
</script>
