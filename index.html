<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style-index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allan:wght@400;700&display=swap" rel="stylesheet">
    <title>Incredibox</title>
</head>

<body>
    <div id="fade"></div>
    <div id="row"></div>
    <div id="config-btn">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
            <path
                d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z" />
        </svg>
    </div>
    <div id="config-menu" style="display:none;">
        <div id="tabs">
            <div class="tab selected" data-tab="credits">credits</div>
            <div class="tab" data-tab="settings">settings</div>
        </div>

        <div id="menu-content">

            <div class="tab-content active" id="credits">
                <p>Incredibox by <span class="color-1">So Far So Good</span></p>
                <p>Initial color palette from Modbox by <span class="color-1">So Far So Good</span></p>
                <p>Initial background from Modbox by <span class="color-1">So Far So Good</span></p>
                <p>Mod by <span class="color-1" id="mod-by-credit">GamerXD1010</span></p>
                <p>Template by <span class="color-1">Sheep-man</span></p>
            </div>

            <div class="tab-content" id="settings">

                <h2 id="theme-title">Theme</h2>
                <div class="setting-row" id="theme-row">
                    <label for="theme-toggle">Light mode</label>
                    <input type="checkbox" id="theme-toggle">
                </div>

                <h2>Interface size</h2>
                <div class="setting-row" id="ui-size-row">
                    <label for="ui-size-slider">Size (<span id="ui-size-value">100</span>%)</label>
                    <input type="range" id="ui-size-slider" min="70" max="150" step="5" value="100">
                </div>
                <button id="reset-size">Reset size</button>

            </div>

        </div>
    </div>
    <div id="gray-overlay" style="display: none;"></div>
    <span id="credit-game">
        Incredibox by <span class="color-1">So Far So Good</span>
    </span>
    <script>

        const UI_SIZE_DEFAULT = 100;

        function getSizeLimits() {
            const width = window.innerWidth;

            if (width <= 400) return { min: 50, max: 110 };
            if (width <= 700) return { min: 60, max: 130 };
            if (width <= 1100) return { min: 70, max: 150 };
            return { min: 70, max: 180 };
        }

        function applyInterfaceSize(percentage) {
            document.documentElement.style.fontSize = percentage + '%';
        }

        function loadInterfaceSize() {
            const saved = localStorage.getItem('uiSize');
            const { min, max } = getSizeLimits();
            let percentage = saved ? parseInt(saved, 10) : UI_SIZE_DEFAULT;
            if (Number.isNaN(percentage)) percentage = UI_SIZE_DEFAULT;
            percentage = Math.min(Math.max(percentage, min), max);
            applyInterfaceSize(percentage);
        }

        loadInterfaceSize();

        // recalculate on rotation/resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(loadInterfaceSize, 200);
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'uiSize') loadInterfaceSize();
        });
    </script>
    <script>
        function config(open) {
            const configMenu = document.getElementById("config-menu");
            const grayOverlay = document.getElementById("gray-overlay");

            configMenu.style.display = open ? "flex" : "none";
            grayOverlay.style.display = open ? "block" : "none";
        }

        function applyTheme(light) {
            const themeToggle = document.getElementById("theme-toggle");
            document.body.classList.toggle("light-theme", light);
            if (themeToggle) themeToggle.checked = light;
        }

        function loadTheme() {
            const saved = localStorage.getItem("theme");
            applyTheme(saved === "light");
        }

        document.addEventListener("DOMContentLoaded", () => {
            const configBtn = document.getElementById("config-btn");
            const configMenu = document.getElementById("config-menu");
            const grayOverlay = document.getElementById("gray-overlay");

            configBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                config(true);
            });

            configMenu.addEventListener("click", (e) => {
                e.stopPropagation();
            });

            grayOverlay.addEventListener("click", () => {
                config(false);
            });

            document.addEventListener("click", () => {
                config(false);
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    config(false);
                }
            });

            const tabs = document.querySelectorAll("#tabs .tab");
            const contents = document.querySelectorAll(".tab-content");

            tabs.forEach(tab => {
                tab.addEventListener("click", () => {
                    tabs.forEach(t => t.classList.remove("selected"));
                    contents.forEach(c => c.classList.remove("active"));

                    tab.classList.add("selected");

                    const id = tab.dataset.tab;
                    document.getElementById(id).classList.add("active");
                });
            });

            const themeToggle = document.getElementById("theme-toggle");
            themeToggle.addEventListener("change", function () {
                applyTheme(this.checked);
                localStorage.setItem("theme", this.checked ? "light" : "dark");
            });

            const uiSizeSlider = document.getElementById("ui-size-slider");
            const resetSizeBtn = document.getElementById("reset-size");

            uiSizeSlider.addEventListener("input", function () {
                const percentage = parseInt(this.value, 10);
                applyInterfaceSize(percentage);
                document.getElementById("ui-size-value").textContent = percentage;
                localStorage.setItem("uiSize", percentage);
            });

            resetSizeBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                applyInterfaceSize(UI_SIZE_DEFAULT);
                document.getElementById("ui-size-value").textContent = UI_SIZE_DEFAULT;
                document.getElementById("ui-size-slider").value = UI_SIZE_DEFAULT;
                localStorage.removeItem("uiSize");
            });

            loadTheme();
            document.getElementById("ui-size-slider").value = document.documentElement.style.fontSize.replace('%', '') || UI_SIZE_DEFAULT;
            document.getElementById("ui-size-value").textContent = document.getElementById("ui-size-slider").value;
        });

        function mod(folder) {
            window.location.href = "app.html?v=" + encodeURIComponent(folder);
        }

        async function loadVersions() {
            const row = document.getElementById("row");
            try {
                const response = await fetch("versions.json");
                if (!response.ok) throw new Error("versions.json not found");
                const versions = await response.json();

                if (!Array.isArray(versions) || versions.length === 0) {
                    row.textContent = "No versions found.";
                    return;
                }

                versions.forEach((v) => {
                    if (!v || !v.folder) return;

                    const name = v["mod-name"] || v.folder;
                    // colors[0] is the "text" color in this palette, use it for the title
                    const titleColor = Array.isArray(v.colors) ? v.colors[0] : null;

                    const tool = document.createElement("div");
                    tool.className = "app-tool";
                    tool.addEventListener("click", () => mod(v.folder));

                    const img = document.createElement("img");
                    img.className = "appimg";
                    img.src = v.icon || "img/icon.jpg";
                    img.alt = name;

                    const nameEl = document.createElement("span");
                    nameEl.className = "appname";
                    nameEl.textContent = name;
                    if (titleColor) nameEl.style.color = titleColor;

                    tool.appendChild(img);
                    tool.appendChild(nameEl);
                    row.appendChild(tool);
                });
            } catch (err) {
                console.warn("Could not load versions.json:", err);
                row.textContent = "Couldn't load versions.";
            }
        }

        loadVersions();
        window.addEventListener("load", () => {

            const fade = document.getElementById("fade");

            fade.classList.add("fade-out");

            fade.addEventListener("transitionend", () => {
                fade.remove();
            });

        });
    </script>
</body>

</html>
