<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mod</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allan:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="fade"></div>
    <span id="credit">
        PORT by <span class="color-1" id="port-by-credit">your name</span>
    </span>
    <span id="credit-game">
        Incredibox by <span class="color-1">So Far So Good</span>
    </span>
    <div id="home-screen-img" src="../img/icon.jpg">
        <span id="nome-do-mod">Modbox</span>
        <img id="mod-title-img" src="" alt="" style="display:none;">
    </div>
    <div id="config-btn">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

    </div>
    <div id="play-button">
        <svg xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

                d="M187.2 100.9C174.8 94.1 159.8 94.4 147.6 101.6C135.4 108.8 128 121.9 128 136L128 504C128 518.1 135.5 531.2 147.6 538.4C159.7 545.6 174.8 545.9 187.2 539.1L523.2 355.1C536 348.1 544 334.6 544 320C544 305.4 536 291.9 523.2 284.9L187.2 100.9z" />
        </svg>
    </div>
    <div id="config-menu" style="display:none;">
        <div id="tabs">
            <div class="tab selected" data-tab="credits">credits</div>
            <div class="tab" data-tab="settings">settings</div>
        </div>

        <div id="menu-content">

            <div class="tab-content active" id="credits">
                <p>Incredibox by <span class="color-1">So Far So Good</span></p>
                <p>Initial color palette from Modbox by <span class="color-1">So Far So Good</span></p>
                <p>Initial background from Modbox by <span class="color-1">So Far So Good</span></p>
                <p>Game template by <span class="color-1" id="mod-by-credit">GamerXD1010</span></p>
                <p>Template by <span class="color-1">Sheep-man</span></p>
            </div>

            <div class="tab-content" id="settings">

                <h2 id="theme-title">Theme</h2>
                <div class="linha-cor" id="theme-row">
                    <label for="theme-toggle">Light mode</label>
                    <input type="checkbox" id="theme-toggle">
                </div>

                <h2>Interface size</h2>
                <div class="linha-cor" id="ui-size-row">
                    <label for="ui-size-slider">Size (<span id="ui-size-value">100</span>%)</label>
                    <input type="range" id="ui-size-slider" min="70" max="150" step="5" value="100">
                </div>
                <button id="restaurar-tamanho">Reset size</button>

            </div>

        </div>
    </div>
    <div id="parte-cinza" style="display: none;"></div>
    <script src="script.js"></script>
    <script>
        const playbutton = document.getElementById("play-button");
        playbutton.addEventListener("click", function () {
            window.location.href = "app.html";
        });
    </script>
</body>

</html>
